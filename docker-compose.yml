services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: halfyshop-php
    volumes:
      - ./app:/var/www/html
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy

  php-cli:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: halfyshop-php-cli
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./app:/var/www/html
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: halfyshop-nginx
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: halfyshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DB:-halfyshop}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql_test:
    image: mysql:8.0
    container_name: halfyshop-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DB_TEST:-halfyshop_test}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql_test_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
  mysql_test_data:
